name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # RAGAUDIT_NO_LLM keeps CI off a model server; the deterministic
        # embedder keeps it off a 470 MB model download.
        env:
          RAGAUDIT_EMBEDDER: deterministic
          RAGAUDIT_NO_LLM: "1"
        run: pytest -q
